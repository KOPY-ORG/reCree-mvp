<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

</div>

<a href="Topic.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: #6D3FD6; color: #FFFFFF; font-size: 15px; font-weight: 700; flex-shrink: 0;">BTS</a>
<a href="Topic.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E7E6E1; font-size: 15px; font-weight: 600; flex-shrink: 0; box-sizing: border-box;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #177A43;"></span>NCT</a>
<a href="Topic.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E7E6E1; font-size: 15px; font-weight: 600; flex-shrink: 0; box-sizing: border-box;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #B3261E;"></span>Stray Kids</a>
</div>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 0 16px;">
<span style="width: 56px; height: 56px; border-radius: 999px; background: #6D3FD6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0;">BTS</span>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
<h1 style="margin: 0; font-size: 24px; font-weight: 700;">BTS</h1>
<span style="font-size: 13px; color: #6B6B66;">K-Pop</span>
</div>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #111111; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #111111; display: flex; align-items: center; gap: 6px;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>
Following</button>
</div>

<div style="padding: 0 16px;">
<div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E7E6E1; padding: 16px;">
<a href="Result.dc.html" style="display: flex; align-items: center; gap: 8px;">
<span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
<span style="font-size: 12px; font-weight: 700; color: #4B2FA8;">BTS ON THE MAP</span>
<span style="font-size: 20px; font-weight: 700; line-height: 1.2;">[N] spots<br>across Korea</span>
<span style="display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; background: #6D3FD6; color: #FFFFFF; font-size: 14px; font-weight: 600; align-self: flex-start; margin-top: 4px;">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>
Open map</span>
</span>

</a>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
<h2 style="margin: 0; font-size: 19px; font-weight: 700;">BTS ReCreeshots</h2>
<a href="#" style="display: flex; align-items: center; gap: 2px; height: 34px; font-size: 14px; font-weight: 600; color: #4A4A45;">See all
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></a>
</div>
<div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden;">
<sc-for list="{{shots}}" as="s" hint-placeholder-count="3">
<a href="#" style="width: 140px; height: 196px; flex-shrink: 0; border-radius: 16px; background: {{s.tone}}; position: relative; overflow: hidden; display: block;">
<span style="position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; background: {{s.color}}; color: #FFFFFF; padding: 3px 8px; border-radius: 999px;">{{s.topic}}</span>
<span style="position: absolute; top: 84px; left: 0; right: 0; text-align: center; font-size: 11px; color: #5E5B53;">[ReCreeshot]</span>
<span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px; background: rgba(17,17,17,0.55); color: #FFFFFF; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 13px; font-weight: 600;">{{s.place}}</span>
<span style="font-size: 11px; color: #E4E3DE;">{{s.area}}</span>
</span>
</a>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
<h2 style="margin: 0; font-size: 19px; font-weight: 700;">BTS journeys</h2>
<a href="#" style="display: flex; align-items: center; gap: 2px; height: 34px; font-size: 14px; font-weight: 600; color: #4A4A45;">See all
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></a>
</div>
<div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden;">
<sc-for list="{{journeys}}" as="j" hint-placeholder-count="2">
<a href="#" style="width: 260px; flex-shrink: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E6E1; overflow: hidden; display: flex; flex-direction: column;">
<span style="height: 100px; background: {{j.tone}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5E5B53;">[Route map preview]</span>
<span style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 16px; font-weight: 700;">[Journey title]</span>
<span style="font-size: 13px; color: #6B6B66;">{{j.meta}}</span>
</span>
</a>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
<h2 style="margin: 0; font-size: 19px; font-weight: 700;">All BTS posts</h2>
<div style="display: flex; gap: 4px; padding: 3px; background: #EFEEEA; border-radius: 999px;">
<button type="button" style="height: 30px; padding: 0 12px; border: none; border-radius: 999px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #111111;">Latest</button>
<button type="button" style="height: 30px; padding: 0 12px; border: none; border-radius: 999px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #4A4A45;">Popular</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 16px;">
<sc-for list="{{posts}}" as="p" hint-placeholder-count="4">
<a href="#" style="height: 200px; border-radius: 16px; background: {{p.tone}}; position: relative; overflow: hidden; display: block;">
<span style="position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; background: #F3E14B; color: #111111; padding: 3px 8px; border-radius: 999px;">{{p.kind}}</span>
<span style="position: absolute; top: 84px; left: 0; right: 0; text-align: center; font-size: 11px; color: #5E5B53;">[Post image]</span>
<span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px; background: rgba(17,17,17,0.55); color: #FFFFFF; font-size: 14px; font-weight: 600;">{{p.title}}</span>
</a>
</sc-for>
</div>
</div>

<div style="height: 110px; flex-shrink: 0;"></div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; justify-content: space-between;">
<div style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 16px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #3A3A42;"></span>
<a href="#" aria-label="Shop" style="display: flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A3A36" stroke-width="1.8" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg></a>
<a href="#" aria-label="Camera" style="display: flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A3A36" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h4l2-3h4l2 3h4v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></a>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 8px 0 16px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
<a href="Main.dc.html" aria-label="Home" style="display: flex; width: 44px; height: 44px; border-radius: 999px; background: #DDF45B; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"></path></svg></a>
<a href="DiscoverCity.dc.html" aria-label="Map" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A3A36" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg></a>
</div>
</div>

</div>
</x-dc>
