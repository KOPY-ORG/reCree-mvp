<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage topics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3A3A38}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<div style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: #3A3A38; font-family: Geist, 'Helvetica Neue', sans-serif; color: #111111; box-sizing: border-box; padding-top: 40px;">
<div style="height: 1060px; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 20px; padding: 16px 16px 24px; box-sizing: border-box;">

<div style="display: flex; align-items: center; justify-content: center; position: relative; height: 44px;">
<h1 style="margin: 0; font-size: 18px; font-weight: 700;">Your topics</h1>
<a href="Main.dc.html" aria-label="Close" style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A3A36" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
</div>

<div>
<label for="topic-find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search topics</label>
<div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; background: #F1F0EC; border-radius: 999px; color: #6B6B66;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="topic-find" placeholder="Search artists, dramas, shows" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #111111; flex-grow: 1;">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 36px;">
<h2 style="margin: 0; font-size: 17px; font-weight: 700;">Pinned</h2>
<span style="font-size: 13px; color: #6B6B66;">Drag to reorder</span>
</div>
<sc-for list="{{pinned}}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; height: 60px;">
<span style="width: 44px; height: 44px; border-radius: 12px; background: {{t.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;">{{t.short}}</span>
<span style="display: flex; flex-direction: column; flex-grow: 1;">
<span style="font-size: 16px; font-weight: 600;">{{t.name}}</span>
<span style="font-size: 12px; color: #6B6B66;">{{t.group}}</span>
</span>
<button type="button" aria-label="Unpin {{t.name}}" style="width: 36px; height: 36px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg>
</button>
<span aria-hidden="true" style="display: flex; width: 28px; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8A84" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h14"></path></svg>
</span>
</div>
</sc-for>
</div>

<div style="height: 1px; background: #ECEBE7;"></div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 36px;">
<h2 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.3px;">{{g.title}}</h2>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
</div>
<sc-for list="{{g.topics}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; height: 60px;">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #F1F0EC; color: #3A3A36; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;">{{t.short}}</span>
<span style="font-size: 16px; font-weight: 600; flex-grow: 1;">{{t.name}}</span>
<button type="button" aria-label="Pin {{t.name}}" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: #DDF45B; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</sc-for>
</div>
</sc-for>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pinned: [
        { name: 'BTS', short: 'BTS', group: 'K-Pop', color: '#6D3FD6' },
        { name: 'NCT', short: 'NCT', group: 'K-Pop', color: '#177A43' },
        { name: 'Stray Kids', short: 'SKZ', group: 'K-Pop', color: '#B3261E' },
        { name: 'The Glory', short: 'TG', group: 'K-Drama', color: '#2B4C8C' }
      ],
      groups: [
        { title: 'K-DRAMA', topics: [{ name: 'King the Land', short: 'KTL' }] },
        { title: 'K-VARIETY', topics: [{ name: 'Culinary Class Wars', short: 'CCW' }, { name: 'Running Man', short: 'RM' }] },
        { title: 'K-FILM', topics: [{ name: 'KPop Demon Hunters', short: 'KDH' }] }
      ]
    };
  }
}
</script>
</body>
</html>
